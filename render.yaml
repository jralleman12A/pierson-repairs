services:
  - type: web
    name: pierson-repairs
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    disk:
      name: pierson-repairs-uploads
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: SESSION_TIMEOUT_MINUTES
        value: "120"
      - key: MAX_UPLOAD_MB
        value: "25"

      # Staff admin — set the password in the Render dashboard, never in this file
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false

      # First-run client account (MCPS). After first boot you can manage
      # clients from /portal/admin and these can be removed.
      - key: BOOTSTRAP_CLIENT_COMPANY
        value: Montgomery County Public Schools
      - key: BOOTSTRAP_CLIENT_USERNAME
        value: mcps
      - key: BOOTSTRAP_CLIENT_PASSWORD
        sync: false

      # Gmail SMTP for CSV reports
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: pierson-repairs-db
          property: connectionString

databases:
  - name: pierson-repairs-db
    plan: starter
