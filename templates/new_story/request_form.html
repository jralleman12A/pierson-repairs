{% extends 'new_story/base.html' %}{% block heading %}Create Request{% endblock %}{% block content %}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="section"><div class="section-head"><h2>Request</h2></div><div class="pad grid grid-3"><div class="field"><label>Ticket Number</label><input name="ticket_number" value="{{ticket_number}}"></div><div class="field"><label>Customer PO</label><input name="customer_po"></div><div class="field"><label>Project</label><input name="project_name"></div><div class="field"><label>Service Type</label><select name="service_type">{% for x in NEW_STORY_SERVICE_TYPES %}<option>{{x}}</option>{% endfor %}</select></div><div class="field"><label>Status</label><select name="status">{% for x in NEW_STORY_REQUEST_STATUSES %}<option>{{x}}</option>{% endfor %}</select></div><div class="field"><label>School / Site</label><input name="school_name"></div><div class="field"><label>Requester</label><input name="requester"></div><div class="field"><label>Recipient / Device User</label><input name="recipient"></div><div class="field"><label>Street</label><input name="street"></div><div class="field"><label>City</label><input name="city"></div><div class="field"><label>State</label><input name="state"></div><div class="field"><label>ZIP</label><input name="zip_code"></div></div></div><div class="section"><div class="section-head"><h2>First Requested Item</h2></div><div class="pad grid grid-4"><div class="field"><label>Category</label><select name="category"><option value="">Add later</option>{% for x in NEW_STORY_CATEGORIES %}<option>{{x}}</option>{% endfor %}</select></div><div class="field"><label>Description</label><input name="item_description"></div><div class="field"><label>Model</label><input name="model"></div><div class="field"><label>Quantity</label><input name="quantity" type="number" min="1" value="1"></div></div><div class="pad" style="padding-top:0"><label style="text-transform:none;font-size:13px;color:var(--text)"><input type="checkbox" name="return_kit_required" style="min-height:auto"> Return kit required</label><div class="field" style="margin-top:12px"><label>Notes</label><textarea name="notes"></textarea></div></div></div><button class="btn btn-primary">Create Request</button> <a class="btn" href="{{url_for('new_story_requests')}}">Cancel</a></form>{% endblock %}
