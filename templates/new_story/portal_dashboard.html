<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Story Service Portal</title><style>body{font-family:system-ui;margin:0;background:#f6f7f8;color:#17202a}header{background:#0a2540;color:white;padding:20px 28px;display:flex;justify-content:space-between}header a{color:white}.wrap{padding:24px 28px}.bar{display:flex;gap:8px;margin-bottom:18px}input,button{font:inherit;padding:8px 10px;border:1px solid #ccd3da}button{background:#0a2540;color:#fff}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #d8dee5}th,td{padding:10px;border-bottom:1px solid #e9edf0;text-align:left}th{font-size:11px;text-transform:uppercase;background:#f7f9fa;color:#607080}a{color:#174f7c;text-decoration:none;font-weight:600}.badge{border:1px solid #ccd3da;padding:3px 6px;font-size:11px}</style></head><body><header><div><strong>New Story</strong> · Pierson IT Service Portal</div><a href="{{url_for('new_story_logout')}}">Sign out</a></header><div class="wrap"><form class="bar"><input name="q" value="{{q}}" placeholder="Search ticket, PO, school…"><button>Search</button></form><table><thead><tr><th>Ticket</th><th>Service</th><th>School / Site</th><th>PO</th><th>Requested</th><th>Status</th><th>Updated</th></tr></thead><tbody>{% for r in rows %}<tr><td><a href="{{url_for('new_story_portal_request',request_id=r.id)}}">{{r.ticket_number}}</a></td><td>{{r.service_type}}</td><td>{{r.school_name|dash}}</td><td>{{r.customer_po|dash}}</td><td>{{r.requested_qty}}</td><td><span class="badge">{{r.status}}</span></td><td>{{r.updated_at|dt}}</td></tr>{% else %}<tr><td colspan="7">No requests found.</td></tr>{% endfor %}</tbody></table></div></body></html>
