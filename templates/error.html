<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ code }} — Pierson Repairs</title>
    <style>
        body {
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: #f4f6f9; color: #1a2035;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 24px;
        }
        .box {
            background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
            padding: 40px 32px; max-width: 420px; width: 100%; text-align: center;
        }
        .code { font-size: 44px; font-weight: 700; color: #1a2744; line-height: 1; }
        .msg { font-size: 15px; color: #475569; margin: 14px 0 26px; }
        .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        a {
            display: inline-block; padding: 9px 18px; border-radius: 9px;
            font-size: 13px; font-weight: 600; text-decoration: none;
            background: #1a2744; color: #fff;
        }
        a.alt { background: transparent; color: #2563eb; border: 1px solid #cbd5e1; }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">{{ code }}</div>
        <div class="msg">{{ message }}</div>
        <div class="links">
            <a href="{{ url_for('cp_login') }}">Client Portal</a>
            <a class="alt" href="{{ url_for('login') }}">Staff Sign-In</a>
        </div>
    </div>
</body>
</html>
