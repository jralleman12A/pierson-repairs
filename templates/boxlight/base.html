<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boxlight Service Portal</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f7fb;color:#172033}.shell{max-width:1400px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#1d4ed8,#0f172a);color:#fff;border-radius:20px;padding:22px 26px;margin-bottom:24px}.cardx{background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 8px 24px rgba(15,23,42,.07)}.stat{padding:18px}.stat b{font-size:30px;display:block}.badge-status{border-radius:999px;padding:6px 10px;background:#e8eef6;color:#1e3a5f;font-weight:700;font-size:12px}.table td,.table th{vertical-align:middle}</style></head><body><div class="shell"><div class="hero d-flex justify-content-between align-items-center flex-wrap gap-3"><div><h2 class="mb-1">Boxlight Service Provider Portal</h2><div>Pierson repair visibility and warranty replacement inventory</div></div><div class="d-flex gap-2 flex-wrap"><a class="btn btn-light btn-sm" href="{{ url_for('boxlight_dashboard') }}">Dashboard</a><a class="btn btn-outline-light btn-sm" href="{{ url_for('boxlight_repairs') }}">Repairs</a><a class="btn btn-outline-light btn-sm" href="{{ url_for('boxlight_stock') }}">Replacement Stock</a><a class="btn btn-outline-light btn-sm" href="{{ url_for('boxlight_logout') }}">Logout</a></div></div>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert alert-{{c}}">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div></body></html>
